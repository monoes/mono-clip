[package]
name = "monoclip"
version = "0.2.11"
description = "A blazing-fast macOS clipboard manager"
authors = ["MonoES"]
edition = "2021"
rust-version = "1.87"
default-run = "monoclip"

[lib]
name = "monoclip_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [ "macos-private-api", "tray-icon", "image-ico", "image-png", "protocol-asset"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
parking_lot = "0.12"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
regex = "1"
arboard = "3.6"
image = { version = "0.25", default-features = false, features = ["png"] }
clap = { version = "4", features = ["derive"] }
ureq = { version = "2", features = ["json"] }

# The X11-only tauri-plugin-global-shortcut grab never receives keys on native
# Wayland compositors. On Linux under Wayland we use the XDG Desktop Portal's
# GlobalShortcuts interface instead (see shortcuts::portal) — the correct
# mechanism there, though not every portal backend implements it yet.
[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["tokio", "global_shortcuts"] }
futures-util = "0.3"

[[bin]]
name = "mclip"
path = "src/bin/mclip.rs"
