name: Release

on:
  push:
    tags:
      - 'v*'

# tauri-action creates the GitHub release itself; without this the default
# GITHUB_TOKEN is read-only here and every job fails at that last step with
# "Resource not accessible by integration", after building successfully.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # Tauri 2 links against webkit2gtk-4.1; libayatana-appindicator3 backs the
      # tray icon and libxdo backs the global-shortcut/keyboard plugins.
      # NB: do not add libappindicator3-dev — it conflicts with the ayatana
      # package on 22.04 and apt will refuse to install both.
      # libfuse2 is FUSE *2* on purpose: the linuxdeploy AppImages that the
      # bundler downloads to build our AppImage are themselves AppImages, and
      # the AppImage runtime needs FUSE2 to mount them.
      # Pinned to 22.04 so the AppImage's glibc floor stays at 2.35 — building
      # on 24.04 would raise it to 2.39 and break older distros.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            desktop-file-utils \
            patchelf \
            libfuse2 \
            file

      - uses: pnpm/action-setup@v4
        with:
          # Pinned: pnpm 11 requires Node >= 22.13 (uses node:sqlite internally)
          # but this workflow runs Node 20 below — "latest" silently broke every
          # job the moment pnpm 11 shipped. pnpm 10 matches this repo's lockfile
          # (lockfileVersion 9.0) and Node 20 fine.
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build mclip binary (macOS / Linux)
        if: runner.os != 'Windows'
        run: |
          mkdir -p src-tauri/binaries
          touch src-tauri/binaries/mclip-${{ matrix.target }}
          cargo build --bin mclip --release --target ${{ matrix.target }} --manifest-path src-tauri/Cargo.toml
          cp src-tauri/target/${{ matrix.target }}/release/mclip src-tauri/binaries/mclip-${{ matrix.target }}

      - name: Build mclip binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -Force -ItemType Directory src-tauri/binaries | Out-Null
          New-Item -Force -ItemType File "src-tauri/binaries/mclip-${{ matrix.target }}.exe" | Out-Null
          cargo build --bin mclip --release --target ${{ matrix.target }} --manifest-path src-tauri/Cargo.toml
          Copy-Item "src-tauri/target/${{ matrix.target }}/release/mclip.exe" "src-tauri/binaries/mclip-${{ matrix.target }}.exe"

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS code signing (optional — add these secrets to enable notarization)
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: MonoClip ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}
